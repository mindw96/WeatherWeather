name: WindowWeather
options:
  bundleIdPrefix: org.windowweather
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 4J7HGK26PF
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 15
targets:
  WeatherCore:
    type: library.static
    platform: macOS
    sources: [Sources/WeatherCore]
    settings:
      base:
        PRODUCT_MODULE_NAME: WeatherCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  WindowWeather:
    type: application
    platform: macOS
    sources:
      - Sources/WeatherApp
      - path: Resources
        buildPhase: resources
        excludes: [".DS_Store"]
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - target: WeatherCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.windowweather.app
        PRODUCT_NAME: WindowWeather
        INFOPLIST_FILE: Config/AppStore-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/AppStore.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        COMBINE_HIDPI_IMAGES: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
schemes:
  WindowWeather:
    build:
      targets:
        WindowWeather: all
    run:
      config: Debug
    archive:
      config: Release
