name: macOS build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: ./script/build_and_run.sh --build-only
      - name: Validate update configuration
        run: python3 script/test_update_config.py
      - name: Build sandboxed App Store configuration
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -project WindowWeather.xcodeproj -scheme WindowWeather -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Test simulation and geometry
        run: swift test
      - name: Test weather service without network
        run: |
          ./dist/WindowWeather.app/Contents/MacOS/WindowWeather --validate-weather-service docs/validation/weather-service.json
          python3 -c 'import json; assert json.load(open("docs/validation/weather-service.json"))["passed"]'
