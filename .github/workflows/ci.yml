name: macOS build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: ./script/build_and_run.sh --build-only
      - name: Validate update configuration
        run: python3 script/test_update_config.py
      - name: Test simulation and geometry
        run: swift test
